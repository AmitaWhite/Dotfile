# DMS 가 Material3 색으로 생성하는 팔레트. 아래 [colors-dark] 는 그 위에 투명도만 덮는다.
include=~/.config/foot/dank-colors.ini

shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=11
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=0.78

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
